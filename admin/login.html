<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Gold Pelet Admin</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <div data-lang-switch-mount></div>
    <img id="login-logo" alt="Gold Pelet">
    <h1 data-i18n="login.title">Admin Dashboard</h1>
    <p class="sub" data-i18n="login.sub">Sign in to manage the Gold Pelet website.</p>

    <div class="login-error" id="login-error"></div>

    <form id="login-form">
      <div class="field">
        <label for="email" data-i18n="login.email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password" data-i18n="login.password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn--primary" style="width:100%;justify-content:center;" id="login-btn" data-i18n="login.signIn">Sign In</button>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script>
  // Already signed in? Skip straight to the dashboard.
  if (getToken()) window.location.href = 'dashboard.html';

  document.getElementById('login-logo').src = mediaURL('/uploads/logo.png');

  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    btn.disabled = true;
    btn.textContent = t('login.signingIn');

    try {
      const res = await fetch(`${API_BASE}/admin/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        }),
      });

      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        errorBox.textContent = data.error || t('login.failed');
        errorBox.classList.add('show');
        return;
      }

      const { token } = await res.json();
      setToken(token);
      window.location.href = 'dashboard.html';
    } catch (err) {
      errorBox.textContent = t('login.unreachable');
      errorBox.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.textContent = t('login.signIn');
    }
  });
</script>
</body>
</html>
