<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Placeholders. scripts/prerender.mjs replaces this title and description
      with the real per-page values when it writes each route's shell, and the
      Seo component keeps them correct once React takes over. The old text here
      described a Baghdad snack brand that does not exist.
    -->
    <title>Gold Pelet — Pellet Snack &amp; Semi-Finished Chips Manufacturer</title>
    <meta
      name="description"
      content="Gold Pelet manufactures potato, corn and wheat pellet snacks and semi-finished chips for food brands worldwide, exported to 25+ countries."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
    />
    <script>
      // Applied before first paint so a stored explicit choice never flashes
      // the other theme. Absent storage we set nothing at all, which is light:
      // index.css carries the light tokens on bare :root and only reaches for
      // the dark ones under [data-theme="dark"], so there is nothing to
      // resolve here and no dark frame to flash on a dark-themed OS.
      try {
        // Key bumped with the light default; see lib/theme.ts. Must match it.
        var t = localStorage.getItem('gp-theme-2')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        var l = localStorage.getItem('gp-lang')
        if (l === 'ar' || l === 'tr') {
          document.documentElement.lang = l
          document.documentElement.dir = l === 'tr' ? 'ltr' : 'rtl'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
